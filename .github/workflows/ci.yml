name: CI

on:
  push:
    branches: [ main, develop, SCRUM-42-infra-ci-cd ]
  pull_request:
    branches: [ main, SCRUM-42-infra-ci-cd ]

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies for backend
      run: cd BobPlanning.back && npm ci

    - name: Lint backend
      run: cd BobPlanning.back && npm run lint
      continue-on-error: true

    - name: Install dependencies for frontend
      run: cd BobPlanning.front && npm ci

    - name: Lint frontend
      run: cd BobPlanning.front && npm run lint
      continue-on-error: true

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install pylint
      run: pip install pylint

    - name: Lint Python microservice
      run: |
        cd BobPlanning.microService
        pylint *.py --disable=C0103,C0114,W0233,R0914
      continue-on-error: true

    - name: Create database env file before testing docker-compose.yml
      run: |
        mkdir -p BobPlanning.database
        cat > BobPlanning.database/.env << EOF
        MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
        MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
        MYSQL_USER=${{ secrets.MYSQL_USER }}
        MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
        MYSQL_ROOT_HOST=${{ secrets.MYSQL_ROOT_HOST }}
        MYSQL_INITDB_SKIP_TZINFO=${{ secrets.MYSQL_INITDB_SKIP_TZINFO }}
        MYSQL_TCP_PORT=${{ secrets.MYSQL_TCP_PORT }}
        MYSQL_WAIT_TIMEOUT=${{ secrets.MYSQL_WAIT_TIMEOUT }}
        MYSQL_INTERACTIVE_TIMEOUT=${{ secrets.MYSQL_INTERACTIVE_TIMEOUT }}
        EOF

    - name: Validate Docker Compose
      run: docker compose config

    - name: Build Docker Compose
      run: docker compose build
