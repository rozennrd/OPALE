# dans backend config/database/db.conf: remplacer localhost par opale-database

services:
#  nginx:
#    build: ./BobPlanning.front
#    container_name: opale-frontend
#    depends_on:
#      - node-app
#    networks:
#      - app-network
#    ports:
#      - "80:80"
#    volumes:
#      - ./BobPlanning.front/dockerization/nginx.conf:/etc/nginx/nginx.conf:z

  node-app:
    build:
      context: ./BobPlanning.back
      dockerfile: Dockerfile.dev
    container_name: opale-backend
    depends_on:
      - db

    environment:
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./BobPlanning.back:/usr/src/app:z
      - /usr/src/app/node_modules
    networks:
      - app-network
      - api-network
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true


  db:
    image: postgres:15
    container_name: opale-postgres-database
    env_file: 
      - BobPlanning.database/.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data:z
      - ./BobPlanning.database/init-scripts:/docker-entrypoint-initdb.d:z
    networks:
      - app-network

  micro-planning:
    build: ./Opale.micro-planning
    container_name: opale-micro-planning
    depends_on:
      - db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - app-network
      - api-network
    ports:
      - "8080:8080"

  opale-new-frontend:
    build:
      context: ./Opale.Front
      dockerfile: Dockerfile.dev
    container_name: opale-new-frontend
    depends_on:
      - node-app
    volumes:
      - ./Opale.Front:/app:z
      - /app/node_modules
    networks:
      - app-network
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_RACINE_FETCHER_URL=http://localhost:3000
    stdin_open: true
    tty: true

networks:
  app-network:
    driver: bridge
  api-network:
    driver: bridge

volumes:
  postgres_data:
