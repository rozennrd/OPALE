# dans backend config/database/db.conf: remplacer localhost par opale-database

services:
  nginx:
    build: ./BobPlanning.front
    container_name: opale-frontend
    depends_on:
      - node-app
    networks:
      - app-network
    ports:
      - "80:80"
    volumes:
      - ./BobPlanning.front/dockerization/nginx.conf:/etc/nginx/nginx.conf:z

  node-app:
    build: ./BobPlanning.back
    container_name: opale-backend
    depends_on:
      - db
    volumes:
      - ./BobPlanning.back:/usr/src/app
      - ./BobPlanning.back/src/database/config:/usr/src/app/dist/database/config
    networks:
      - app-network
      - api-network
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production

  db:
    image: postgres:15
    container_name: postgres-database
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"   # port externe 5433 → port interne 5432
    volumes:
      - ../bobPlanning.db:/var/lib/postgresql/data
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@email.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "8080:80"  # pgAdmin accessible via http://localhost:8080
    networks:
      - app-network

  python-api:
    build: ./BobPlanning.microService
    container_name: opale-python-api
    networks:
      - api-network
    ports:
      - "5000:5000"

  opale-new-frontend:
    build: ./Opale.Front
    container_name: opale-new-frontend
    depends_on:
      - node-app
    networks:
      - app-network
    ports:
      - "8080:80"

networks:
  app-network:
    driver: bridge
  API_network:
    driver: bridge
