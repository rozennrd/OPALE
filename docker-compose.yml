services:
  php-fpm:
    image: php:8.1-fpm
    networks:
      - app-network
    volumes:
      - ./phpmyadmin:/usr/share/phpmyadmin

  nginx:
    build: ./BobPlanning.front
    networks:
      - app-network
    volumes:
      - ./BobPlanning.front/dockerization/nginx.conf:/etc/nginx/nginx.conf
      - ./phpmyadmin:/usr/share/phpmyadmin
    ports:
      - "80:80"
    depends_on:
      - php-fpm

  node-app:
    build: ./BobPlanning.back
    container_name: node-application
    ports:
      - "3000:3000"
    depends_on:
      - db
    volumes:
      - ./BobPlanning.back:/usr/src/app
      - ./BobPlanning.back/src/database/config:/usr/src/app/dist/database/config
    networks:
      - app-network
      - API_network

  db:
    image: postgres:15
    container_name: postgres-database
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"   # port externe 5433 → port interne 5432
    volumes:
      - ../bobPlanning.db:/var/lib/postgresql/data
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@email.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "8080:80"  # pgAdmin accessible via http://localhost:8080
    networks:
      - app-network

  python-api:
    build: ./BobPlanning.microService
    networks:
      - API_network

networks:
  app-network:
    driver: bridge
  API_network:
    driver: bridge
